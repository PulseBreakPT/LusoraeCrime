name: Backend regression checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "backend-checks"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile backend/engine.py backend/routes_game.py backend/road_routing.py backend/auth.py backend/reward_engine.py backend/server.py

      - name: Test Portugal economy
        run: python backend/tests/test_economy_portugal_2026.py
