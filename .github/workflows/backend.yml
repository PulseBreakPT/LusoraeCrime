name: Backend regression checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "backend-checks"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile backend/engine.py backend/routes_game.py backend/routes_organization.py backend/organization_systems.py backend/models.py backend/retention_engine.py backend/road_routing.py backend/travel_metrics.py backend/time_rules.py backend/auth.py backend/reward_engine.py backend/server.py

      - name: Test Portugal economy
        run: python backend/tests/test_economy_portugal_2026.py

      - name: Test retention engine
        run: python backend/tests/test_retention_engine.py

      - name: Test organization systems
        run: PYTHONPATH=backend python backend/tests/test_organization_systems.py

      - name: Test Portugal operation hours
        run: PYTHONPATH=backend python -c "import runpy; ns=runpy.run_path('backend/tests/test_core_audit_regressions.py'); ns['test_operation_hours_follow_portugal_local_time']()"

      - name: Test road mission metrics
        run: PYTHONPATH=backend python -c "import runpy; ns=runpy.run_path('backend/tests/test_core_audit_regressions.py'); ns['test_road_metrics_use_real_out_and_return_distances']()"

      - name: Test operation mechanical profiles
        run: PYTHONPATH=backend python -c "import runpy; ns=runpy.run_path('backend/tests/test_core_audit_regressions.py'); ns['test_operation_profiles_create_real_mechanical_families']()"

      - name: Test repeat and rare reward direction
        run: PYTHONPATH=backend python -c "import runpy; ns=runpy.run_path('backend/tests/test_core_audit_regressions.py'); ns['test_repeat_penalty_and_rare_bonus_have_correct_direction']()"
