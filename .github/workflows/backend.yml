name: Backend regression checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "backend-checks"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile backend/engine.py backend/game_data.py backend/economy_constants.py backend/quests_data.py backend/mastermind_data.py backend/routes_game.py backend/routes_mastermind.py backend/routes_organization.py backend/routes_city.py backend/routes_admin.py backend/city_systems.py backend/city_data.py backend/organization_systems.py backend/organization_intelligence.py backend/organization_automation.py backend/organization_events.py backend/economy_director.py backend/mutation_guard.py backend/state_lease.py backend/player_access.py backend/models.py backend/retention_engine.py backend/operational_director.py backend/road_routing.py backend/travel_metrics.py backend/time_rules.py backend/auth.py backend/reward_engine.py backend/server.py

      - name: Test critical settlement safety
        run: python backend/tests/test_critical_settlement_safety.py

      - name: Test Portugal economy
        run: python backend/tests/test_economy_portugal_2026.py

      - name: Test global economy director
        run: PYTHONPATH=backend python backend/tests/test_economy_director.py

      - name: Test level 100 progression
        run: PYTHONPATH=backend python backend/tests/test_level_100_progression.py

      - name: Test launch safety contracts
        run: python backend/tests/test_launch_contracts.py

      - name: Test retention engine
        run: python backend/tests/test_retention_engine.py

      - name: Test operational director
        run: PYTHONPATH=backend python backend/tests/test_operational_director.py

      - name: Test living city systems
        run: PYTHONPATH=backend python backend/tests/test_city_systems.py

      - name: Test organization systems
        run: PYTHONPATH=backend python backend/tests/test_organization_systems.py

      - name: Test organization intelligence
        run: PYTHONPATH=backend python backend/tests/test_organization_intelligence.py

      - name: Test Portugal operation hours
        run: PYTHONPATH=backend python -c "from datetime import datetime,timezone; from time_rules import portugal_hour_allowed; assert portugal_hour_allowed((22,5), datetime(2026,7,1,21,30,tzinfo=timezone.utc)); assert not portugal_hour_allowed((22,5), datetime(2026,7,1,20,30,tzinfo=timezone.utc))"

      - name: Test road mission metrics
        run: PYTHONPATH=backend python -c "from travel_metrics import road_mission_metrics; m=road_mission_metrics({'distance':12000},{'distance':14000},{'cons':8.0},10.0); assert m['round_km']==26 and abs(m['fuel_needed']-2.08)<1e-9 and m['travel_s']==1200 and m['return_travel_s']==1400"

      - name: Test operation mechanical profiles
        run: PYTHONPATH=backend python -c "from game_data import operation_profile_of; assert operation_profile_of('ciberataque_bancario','tecnica')=='digital'; assert operation_profile_of('rota_internacional','logistica')=='mobility'; assert operation_profile_of('operacao_fantasma','especial')=='stealth'; assert operation_profile_of('chantagem_politico','influencia')=='influence'; assert operation_profile_of('assalto_blindado','assalto')=='confrontation'"

      - name: Test repeat and rare reward direction
        run: PYTHONPATH=backend python -c "from reward_engine import calculate_money_reward as f; kw=dict(difficulty_score=1.2,risk=3,org_level=3,category='assalto',multiplier_stack=1.0); common=f(is_rare_mission=False,repeat_count=0,**kw); repeated=f(is_rare_mission=False,repeat_count=1,**kw); rare=f(is_rare_mission=True,repeat_count=0,**kw); assert repeated < common < rare"
