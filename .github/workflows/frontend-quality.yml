name: Frontend quality gate

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/scripts/**"
      - "frontend/public/**"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/craco.config.js"
      - "frontend/tailwind.config.js"
      - "frontend/postcss.config.js"
      - "design_guidelines.json"
      - "PRODUCT.md"
      - "DESIGN.md"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/scripts/**"
      - "frontend/public/**"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/craco.config.js"
      - "frontend/tailwind.config.js"
      - "frontend/postcss.config.js"
      - "design_guidelines.json"
      - "PRODUCT.md"
      - "DESIGN.md"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload frontend source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: frontend-source-snapshot
          path: frontend/src
          retention-days: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Cache installed dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('frontend/package.json', 'frontend/yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: yarn install --prefer-offline --non-interactive

      - name: Run Impeccable detector
        id: impeccable
        shell: bash
        run: |
          set +e
          npx -y impeccable detect --json src/ > ../impeccable-findings.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat ../impeccable-findings.json
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi

      - name: Upload Impeccable findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-findings
          path: impeccable-findings.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run SUBMUNDO static UI audit
        run: |
          set +e
          node scripts/ui-quality-audit.mjs > ../ui-quality-audit.json
          code=$?
          cat ../ui-quality-audit.json
          exit "$code"

      - name: Upload SUBMUNDO UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submundo-ui-audit
          path: ui-quality-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run frontend regression tests
        env:
          CI: "true"
        run: yarn test --watchAll=false --runInBand --runTestsByPath src/game/localGuestEngine.test.js src/game/livingCity.test.js src/game/economyDirector.test.js src/lib/mapTiles.test.js src/lib/game.activity.test.js src/lib/routing.test.js src/lib/uiActionOwnership.test.js

      - name: Build production bundle
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
          REACT_APP_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL || 'https://lusora-patrols.preview.emergentagent.com' }}
          REACT_APP_AUTH_UI_ENABLED: "true"
          REACT_APP_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: yarn build
