name: Diagnose public backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-backend.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check preview backend
        shell: bash
        run: |
          set +e
          echo "=== GET preview ==="
          curl -sS -D - --max-time 15 https://lusora-patrols.preview.emergentagent.com/api/ -o /tmp/preview-body
          cat /tmp/preview-body || true
          echo
          echo "=== OPTIONS preview from GitHub Pages ==="
          curl -sS -D - --max-time 15 -X OPTIONS \
            -H 'Origin: https://pulsebreakpt.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            https://lusora-patrols.preview.emergentagent.com/api/auth/register \
            -o /tmp/preview-options
          cat /tmp/preview-options || true
          echo

      - name: Try real guest flow on preview
        shell: bash
        run: |
          set +e
          ID="$(date +%s)-$RANDOM"
          EMAIL="guest-diagnostic-$ID@lusorae.pt"
          PASSWORD="DiagGuest!Aa1$ID"
          ORG="Diag $ID"

          echo "=== POST /api/auth/register ==="
          STATUS="$(curl -sS --max-time 20 -o /tmp/register.json -w '%{http_code}' \
            -H 'Origin: https://pulsebreakpt.github.io' \
            -H 'Content-Type: application/json' \
            -d "{\"org_name\":\"$ORG\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"accept_terms\":true}" \
            https://lusora-patrols.preview.emergentagent.com/api/auth/register)"
          echo "HTTP $STATUS"
          cat /tmp/register.json || true
          echo

          TOKEN="$(python - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/register.json')).get('access_token',''))
          except Exception:
              print('')
          PY
          )"

          if [[ -n "$TOKEN" ]]; then
            echo "=== GET /api/auth/me ==="
            curl -sS -D - --max-time 20 \
              -H "Authorization: Bearer $TOKEN" \
              https://lusora-patrols.preview.emergentagent.com/api/auth/me || true
            echo
            echo "=== GET /api/game/state ==="
            curl -sS -D - --max-time 20 \
              -H "Authorization: Bearer $TOKEN" \
              https://lusora-patrols.preview.emergentagent.com/api/game/state || true
            echo
            echo "=== cleanup /api/auth/delete-account ==="
            curl -sS -D - --max-time 20 -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"password\":\"$PASSWORD\"}" \
              https://lusora-patrols.preview.emergentagent.com/api/auth/delete-account || true
            echo
          fi

      - name: Check Hostinger backend
        shell: bash
        run: |
          set +e
          echo "=== GET Hostinger ==="
          curl -sS -D - --max-time 15 https://srv1758509.hstgr.cloud/api/ -o /tmp/host-body
          cat /tmp/host-body || true
          echo
          echo "=== OPTIONS Hostinger from GitHub Pages ==="
          curl -sS -D - --max-time 15 -X OPTIONS \
            -H 'Origin: https://pulsebreakpt.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            https://srv1758509.hstgr.cloud/api/auth/register \
            -o /tmp/host-options
          cat /tmp/host-options || true
          echo
