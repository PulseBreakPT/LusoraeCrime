name: Android / Google Play readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/auth.py"
      - "backend/server.py"
      - "backend/requirements.txt"
      - "deploy/backend/requirements.production.txt"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: "android-validation"
  cancel-in-progress: true

jobs:
  validate:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 / API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Python auth syntax
        run: python -m py_compile backend/auth.py backend/server.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Build production web bundle
        working-directory: frontend
        env:
          CI: "false"
          REACT_APP_AUTH_UI_ENABLED: "true"
          REACT_APP_BACKEND_URL: ${{ vars.ANDROID_BACKEND_URL || 'https://lusora-patrols.preview.emergentagent.com' }}
          REACT_APP_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: yarn build

      - name: Create native Android project
        working-directory: frontend
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-capacitor-android.mjs

      - name: Verify Android policy targets
        working-directory: frontend
        run: |
          grep -R "targetSdkVersion = 36" android/variables.gradle
          grep -R "compileSdkVersion = 36" android/variables.gradle
          grep -R "minSdkVersion = 24" android/variables.gradle
          grep -R "package pt.lusorae.crime" android/app/src/main/java/pt/lusorae/crime/MainActivity.java

      - name: Build Android App Bundle
        working-directory: frontend/android
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload test AAB
        uses: actions/upload-artifact@v4
        with:
          name: lusorae-android-debug-aab
          path: frontend/android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
