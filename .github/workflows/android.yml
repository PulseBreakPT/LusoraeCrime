name: Android / Google Play readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    # UI-only changes are already compiled by the Pages workflow.
    # Rebuild Android automatically only when native/dependency/auth packaging can change.
    paths:
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "frontend/capacitor.config.js"
      - "frontend/scripts/patch-capacitor-android.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: "android-validation"
  cancel-in-progress: true

jobs:
  validate:
    name: Build Android AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE || '1' }}
      ANDROID_VERSION_NAME: ${{ vars.ANDROID_VERSION_NAME || '1.0.0' }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/yarn.lock', 'frontend/capacitor.config.js', 'frontend/scripts/patch-capacitor-android.mjs') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Android API 36
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          if [[ ! -d /usr/local/lib/android/sdk/platforms/android-36 || ! -d /usr/local/lib/android/sdk/build-tools/36.0.0 ]]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Cache installed frontend dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node22-modules-${{ hashFiles('frontend/package.json', 'frontend/yarn.lock') }}

      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: yarn install --prefer-offline --non-interactive

      - name: Build production web bundle
        working-directory: frontend
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
          PUBLIC_URL: "/"
          REACT_APP_AUTH_UI_ENABLED: "true"
          REACT_APP_BACKEND_URL: ${{ vars.ANDROID_BACKEND_URL || 'https://lusora-patrols.preview.emergentagent.com' }}
          REACT_APP_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: yarn build

      - name: Create native Android project
        working-directory: frontend
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-capacitor-android.mjs

      - name: Verify Android policy targets
        working-directory: frontend
        run: |
          grep -R "targetSdkVersion = 36" android/variables.gradle
          grep -R "compileSdkVersion = 36" android/variables.gradle
          grep -R "minSdkVersion = 24" android/variables.gradle
          grep -R "package pt.lusorae.crime" android/app/src/main/java/pt/lusorae/crime/MainActivity.java

      - name: Build Android App Bundle
        working-directory: frontend/android
        run: ./gradlew bundleDebug --no-daemon --parallel --build-cache --stacktrace

      - name: Audit merged Android permissions
        working-directory: frontend/android
        run: |
          MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifests|packaged_manifests' | head -n 1)"
          test -n "$MANIFEST"
          echo "Auditing $MANIFEST"
          python - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest = sys.argv[1]
          root = ET.parse(manifest).getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          permissions = sorted({
              node.attrib.get(ns + "name", "")
              for node in root.iter()
              if node.tag.endswith("uses-permission") and node.attrib.get(ns + "name")
          })
          print("Merged permissions:")
          for permission in permissions:
              print(" -", permission)

          unnecessary_sensitive = {
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.GET_ACCOUNTS",
              "android.permission.READ_SMS",
              "android.permission.SEND_SMS",
              "android.permission.RECEIVE_SMS",
              "android.permission.READ_CALL_LOG",
              "android.permission.WRITE_CALL_LOG",
              "android.permission.READ_PHONE_STATE",
              "android.permission.MANAGE_EXTERNAL_STORAGE",
              "com.google.android.gms.permission.AD_ID",
          }
          found = sorted(set(permissions) & unnecessary_sensitive)
          if found:
              print("ERROR: sensitive permissions not required by the current SUBMUNDO feature set:", file=sys.stderr)
              for permission in found:
                  print(" -", permission, file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Upload test AAB
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: submundo-android-debug-aab
          path: frontend/android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Report release signing status
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "::notice::Native validation passed. Signed Play release is reserved for manual release runs."
          elif [[ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]]; then
            echo "::notice::Upload-key secrets are not configured. Native validation passed; signed Play release is skipped."
          else
            echo "Upload-key secrets detected; a signed Play release AAB will be built."
          fi

      - name: Validate production release configuration
        if: github.event_name == 'workflow_dispatch' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "::error::GOOGLE_WEB_CLIENT_ID is required for a Play release"; exit 1; }
          test -n "$ANDROID_BACKEND_URL" || { echo "::error::ANDROID_BACKEND_URL is required for a Play release"; exit 1; }
          [[ "$ANDROID_BACKEND_URL" == https://* ]] || { echo "::error::ANDROID_BACKEND_URL must use HTTPS"; exit 1; }
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_UPLOAD_KEYSTORE_PASSWORD is required"; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_ALIAS" || { echo "::error::ANDROID_UPLOAD_KEY_ALIAS is required"; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD" || { echo "::error::ANDROID_UPLOAD_KEY_PASSWORD is required"; exit 1; }

      - name: Restore Play upload key
        if: github.event_name == 'workflow_dispatch' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != ''
        working-directory: frontend
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/submundo-upload.jks
          chmod 600 android/app/submundo-upload.jks

      - name: Build signed Play release AAB
        if: github.event_name == 'workflow_dispatch' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != ''
        working-directory: frontend/android
        run: |
          ./gradlew bundleRelease --no-daemon --parallel --build-cache --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/app/submundo-upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"

      - name: Upload signed Play AAB
        if: github.event_name == 'workflow_dispatch' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: submundo-google-play-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove upload key
        if: always() && github.event_name == 'workflow_dispatch' && env.ANDROID_UPLOAD_KEYSTORE_BASE64 != ''
        run: rm -f frontend/android/app/submundo-upload.jks
