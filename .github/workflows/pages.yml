name: Deploy LusoraeCrime to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --non-interactive

      # Regression gate: frontend, routing and backend syntax are checked together.
      - name: Test Portugal economy
        run: |
          python -m py_compile ../backend/engine.py ../backend/routes_game.py ../backend/road_routing.py ../backend/auth.py ../backend/reward_engine.py
          python ../backend/tests/test_economy_portugal_2026.py

      - name: Test offline guest engine
        env:
          CI: "true"
        run: yarn test --watchAll=false --runInBand src/game/localGuestEngine.test.js src/lib/mapTiles.test.js src/lib/game.activity.test.js src/lib/routing.test.js src/lib/uiActionOwnership.test.js

      - name: Build frontend
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL || 'https://lusora-patrols.preview.emergentagent.com' }}
          REACT_APP_AUTH_UI_ENABLED: "true"
          REACT_APP_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: yarn build

      - name: Add GitHub Pages SPA fallback
        run: |
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
